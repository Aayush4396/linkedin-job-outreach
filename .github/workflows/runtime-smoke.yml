name: Runtime smoke test
on:
  push:
    branches: [verify/runtime-smoke]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select runner-local Ubuntu mirror for both builds
        run: |
          cat > "$RUNNER_TEMP/runner-mirror.py" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          # Change only the apt download host. Ubuntu still verifies package signatures.
          setup = ("RUN sed -i -E 's@(archive|security).ubuntu.com@azure.archive.ubuntu.com@g' "
                   "/etc/apt/sources.list.d/ubuntu.sources && ")
          path.write_text(source.replace("RUN apt-get update", setup + "apt-get update"))
          PY
          python "$RUNNER_TEMP/runner-mirror.py" Dockerfile
      - name: Build candidate
        run: docker build -t hiremate:candidate .
      - name: Exercise Chromium, Word conversion and scanned PDF OCR
        run: docker run --rm -i hiremate:candidate python3 - < tests/runtime_smoke.py
      - name: Verify service startup
        run: |
          docker run -d --name preview -p 127.0.0.1:8766:8080 -e EXTERNAL_SCHEDULER=true hiremate:candidate
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8766/api/posts > /dev/null
      - name: Measure against the previous runtime
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          git archive 32c40ca | tar -x -C "$RUNNER_TEMP/previous"
          python "$RUNNER_TEMP/runner-mirror.py" "$RUNNER_TEMP/previous/Dockerfile"
          docker build -t hiremate:previous "$RUNNER_TEMP/previous"
          docker image inspect hiremate:previous hiremate:candidate --format '{{index .RepoTags 0}} {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
