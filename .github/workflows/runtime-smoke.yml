name: Runtime smoke test
on:
  push:
    branches: [verify/runtime-smoke]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check HTTPS package mirrors
        run: |
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu https://mirrors.mit.edu/ubuntu; do
            if curl -fsSL --max-time 12 "$mirror/dists/noble/InRelease" -o /dev/null && curl -fsSL --max-time 15 "$mirror/pool/main/libw/libwps/libwps-0.4-4_0.4.14-2build1_amd64.deb" -o /dev/null; then
              echo "UBUNTU_MIRROR=$mirror" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          exit 1
      - name: Build candidate
        run: docker build --build-arg UBUNTU_MIRROR="$UBUNTU_MIRROR" -t hiremate:candidate .
      - name: Exercise Chromium, Word conversion and scanned PDF OCR
        run: docker run --rm -i hiremate:candidate python3 - < tests/runtime_smoke.py
      - name: Verify service startup
        run: |
          docker run -d --name preview -p 127.0.0.1:8766:8080 -e EXTERNAL_SCHEDULER=true hiremate:candidate
          for attempt in {1..30}; do
            if curl -fsS --max-time 3 http://127.0.0.1:8766/api/posts > /dev/null; then exit 0; fi
            if [[ "$(docker inspect -f '{{.State.Running}}' preview)" != true ]]; then break; fi
            sleep 1
          done
          docker logs preview
          exit 1
      - name: Measure against the previous runtime
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          git archive 32c40ca | tar -x -C "$RUNNER_TEMP/previous"
          sed -i "s@RUN apt-get update@RUN sed -i -E 's%http://(archive|security).ubuntu.com/ubuntu%$UBUNTU_MIRROR%g' /etc/apt/sources.list.d/ubuntu.sources \&\& apt-get update@" "$RUNNER_TEMP/previous/Dockerfile"
          docker build -t hiremate:previous "$RUNNER_TEMP/previous"
          docker image inspect hiremate:previous hiremate:candidate --format '{{index .RepoTags 0}} {{.Size}} bytes' | tee -a "$GITHUB_STEP_SUMMARY"
